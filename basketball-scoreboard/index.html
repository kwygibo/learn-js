<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <div class="column">
            <h3 class="score-title">HOME</h3>
            <h2 class="score" id="home-score">0</h2>
            <div>
                <button id="home-plus-one-btn" onclick="increaseMultiPoints(1, 'home')">+1</button>
                <button id="home-plus-two-btn" onclick="increaseMultiPoints(2, 'home')">+2</button>
                <button id="home-plus-three-btn" onclick="increaseMultiPoints(3, 'home')">+3</button>
            </div>
        </div>
        <div class="column">
            <h3 class="score-title">GUEST</h3>
            <h2 class="score" id="guest-score">0</h2>
            <div>
                <button id="guest-plus-one-btn" onclick="increaseMultiPoints(1, 'guest')">+1</button>
                <button id="guest-plus-two-btn" onclick="increaseMultiPoints(2, 'guest')">+2</button>
                <button id=" guest-plus-three-btn" onclick="increaseMultiPoints(3, 'guest')">+3</button>
            </div>
        </div>
    </div>
    <script src=" index.js"></script>
</body>

</html>
